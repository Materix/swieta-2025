<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Świąteczne losowanie</title>
<style>
  :root {
    --bg: #0f2a1d; --card: #fffaf0; --ink: #1d1d1b; --muted: #6b6b63;
    --red: #b3202a; --red-dark: #8c1820; --gold: #d9a441;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: radial-gradient(circle at 50% 0%, #1d4a33, var(--bg) 70%);
    font-family: Georgia, "Times New Roman", serif; color: var(--ink);
  }
  .card {
    width: 100%; max-width: 420px; background: var(--card); border-radius: 18px;
    padding: 32px 24px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,.4);
    border-top: 6px solid var(--red);
  }
  .tree { font-size: 48px; line-height: 1; }
  h1 { font-size: 26px; margin: 12px 0 4px; }
  .house {
    display: inline-block; margin: 4px 0 14px; padding: 6px 18px; border-radius: 999px;
    background: var(--red); color: #fff; font-size: 20px; font-weight: bold; letter-spacing: .5px;
  }
  .year { display: block; margin: 0 auto 24px; color: var(--muted); font-size: 14px; }
  .year select {
    font: inherit; font-size: 15px; color: var(--ink); background: #f3ead6;
    border: 1px solid var(--gold); border-radius: 999px; padding: 6px 12px; margin-left: 6px;
  }
  button {
    font: inherit; font-size: 18px; color: #fff; background: var(--red); border: 0;
    border-radius: 999px; padding: 14px 28px; cursor: pointer;
  }
  button:hover { background: var(--red-dark); }
  .result { display: none; }
  .result.shown { display: block; animation: pop .5s ease-out; }
  .label { color: var(--muted); margin: 0 0 8px; }
  .name { font-size: 40px; font-weight: bold; color: var(--red); margin: 0 0 8px; }
  .gift { font-size: 56px; }
  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
  a.person {
    display: block; padding: 12px; border-radius: 12px; text-decoration: none;
    color: var(--ink); background: #f3ead6; border: 1px solid var(--gold);
  }
  a.person:hover { background: #eadcbd; }
  .error { color: var(--red); }
  @keyframes pop { from { transform: scale(.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  /* Prezent do otwarcia */
  .present {
    position: relative; width: 140px; height: 150px; margin: 8px auto 20px; padding: 0;
    background: none; border-radius: 0; cursor: pointer;
  }
  .present:hover { background: none; }
  .present .box, .present .lid { position: absolute; left: 50%; background: var(--red); }
  .present .box { bottom: 0; width: 120px; height: 100px; margin-left: -60px; border-radius: 0 0 8px 8px; }
  .present .lid {
    bottom: 96px; width: 136px; height: 30px; margin-left: -68px; border-radius: 6px;
    background: var(--red-dark); transform-origin: 20% 100%;
  }
  .present .box::before, .present .lid::before {
    content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 20px; margin-left: -10px;
    background: var(--gold);
  }
  .present .bow {
    position: absolute; left: 50%; bottom: 100%; width: 60px; height: 30px; margin-left: -30px;
  }
  .present .bow::before, .present .bow::after {
    content: ""; position: absolute; bottom: -2px; width: 28px; height: 24px;
    border: 7px solid var(--gold); border-radius: 50% 50% 0 50%;
  }
  .present .bow::before { left: 0; transform: rotate(-20deg); }
  .present .bow::after { right: 0; transform: rotate(20deg) scaleX(-1); }
  .hint { color: var(--muted); font-size: 14px; margin: 0 0 4px; }
  .present.shaking { animation: shake .9s ease-in-out; }
  .present.open .lid { animation: lid-off .6s ease-in forwards; }
  .present.open .box { animation: box-out .5s .35s ease-in forwards; }
  @keyframes shake {
    0%, 100% { transform: rotate(0); }
    15% { transform: rotate(-8deg); } 30% { transform: rotate(8deg); }
    45% { transform: rotate(-10deg) scale(1.05); } 60% { transform: rotate(10deg) scale(1.05); }
    75% { transform: rotate(-5deg); } 90% { transform: rotate(4deg); }
  }
  @keyframes lid-off { to { transform: translate(60px, -90px) rotate(55deg); opacity: 0; } }
  @keyframes box-out { to { transform: translateY(20px) scale(.6); opacity: 0; } }
  .sparkles { position: relative; height: 0; }
  .sparkles span {
    position: absolute; left: 50%; top: -60px; font-size: 22px; opacity: 0;
    animation: burst 1s ease-out forwards;
  }
  @keyframes burst {
    0% { transform: translate(0, 0) scale(.4); opacity: 1; }
    100% { transform: translate(var(--x), var(--y)) scale(1); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .present.shaking, .present.open .lid, .present.open .box, .sparkles span, .result.shown { animation: none; }
  }
</style>
</head>
<body>
<main class="card" id="app">
  <div class="tree">🎄</div>
  <h1>Świąteczne losowanie</h1>
  <div class="house" id="house"></div>
  <label class="year">Rok losowania <select id="year"></select></label>
  <div id="content"></div>
</main>
<script>
  // Domy: uczestnicy i lata, dla których istnieje katalog <dom>/<rok> — dopisz nowy rok po losowaniu.
  const HOUSES = {
    zary: {
      name: "Żary",
      people: ["Agnieszka", "Gabrysia", "Krzysztof", "Michal", "Ola"],
      years: ["2024", "2025", "2026"],
    },
    beczarka: {
      name: "Bęczarka",
      people: ["Agula-Bartula", "Ola-Michal", "Kasia-Pawel", "Julianka-Piotrek", "Rodzice"],
      years: ["2025", "2026"],
    },
  };
  const DISPLAY = {
    Michal: "Michał",
    "Agula-Bartula": "Agula i Bartula", "Ola-Michal": "Ola i Michał", "Kasia-Pawel": "Kasia i Paweł",
    "Julianka-Piotrek": "Julianka i Piotrek", Rodzice: "Kasia i Staś (rodzice)", Jozek: "Józek",
  };
  const show = (p) => DISPLAY[p] || p;

  const params = new URLSearchParams(location.search);
  const houseId = HOUSES[params.get("dom")] ? params.get("dom") : "zary";
  const house = HOUSES[houseId];
  const YEARS = house.years;
  const thisYear = String(new Date().getFullYear());
  const defaultYear = YEARS.includes(thisYear)
    ? thisYear
    : YEARS.filter((y) => y <= thisYear).pop() || YEARS[YEARS.length - 1];

  const year = YEARS.includes(params.get("rok")) ? params.get("rok") : defaultYear;
  const person = house.people.find((p) => p === params.get("osoba"));
  const content = document.getElementById("content");
  document.getElementById("house").textContent = "🏠 " + house.name;
  document.title = "Świąteczne losowanie — " + house.name;
  // Dom zawsze w adresie (stare linki bez ?dom= trafiają do Żar).
  if (params.get("dom") !== houseId) {
    params.set("dom", houseId);
    history.replaceState(null, "", "?" + params.toString());
  }
  const yearSelect = document.getElementById("year");
  for (const y of [...YEARS].reverse()) yearSelect.add(new Option(y, y, false, y === year));
  yearSelect.addEventListener("change", () => {
    if (yearSelect.value === defaultYear) params.delete("rok");
    else params.set("rok", yearSelect.value);
    location.search = params.toString();
  });

  if (!person) {
    content.innerHTML = '<p class="label">Wybierz siebie:</p><ul></ul>';
    const list = content.querySelector("ul");
    for (const p of house.people) {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.className = "person";
      a.href = "?dom=" + houseId + "&osoba=" + encodeURIComponent(p) + (year !== defaultYear ? "&rok=" + year : "");
      a.textContent = show(p);
      li.appendChild(a);
      list.appendChild(li);
    }
  } else {
    content.innerHTML =
      '<p class="label">Cześć <strong></strong>!</p>' +
      '<p class="hint">Kliknij prezent, żeby go otworzyć</p>' +
      '<button type="button" class="present" aria-label="Otwórz prezent">' +
      '<span class="lid"><span class="bow"></span></span><span class="box"></span></button>' +
      '<p class="error" hidden></p><div class="sparkles"></div>' +
      '<div class="result"><p class="label">Twój los na rok <span class="y"></span> — prezent dla:</p>' +
      '<p class="name"></p><div class="child" hidden><p class="label">oraz dla dziecka:</p>' +
      '<p class="name"></p></div><div class="gift">🎁</div></div>';
    content.querySelector("strong").textContent = show(person);
    content.querySelector(".y").textContent = year;
    const button = content.querySelector(".present");
    const hint = content.querySelector(".hint");
    const error = content.querySelector(".error");
    const result = content.querySelector(".result");
    // Po pierwszym otwarciu zapamiętujemy to w przeglądarce i kolejnym razem pokazujemy wynik od razu.
    const storageKey = "otwarte:" + houseId + "/" + year + "/" + person;
    const storage = {
      get() { try { return localStorage.getItem(storageKey) === "1"; } catch (e) { return false; } },
      set() { try { localStorage.setItem(storageKey, "1"); } catch (e) {} },
    };
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;

    async function loadResult() {
      const res = await fetch(houseId + "/" + year + "/" + person + ".txt", { cache: "no-store" });
      if (!res.ok) throw new Error(res.status);
      const [taker, child] = (await res.text()).trim().split(/\s*\n\s*/);
      result.querySelector(".name").textContent = show(taker);
      if (child) {
        const box = result.querySelector(".child");
        box.querySelector(".name").textContent = show(child);
        box.hidden = false;
      }
    }

    function sparkle() {
      const host = content.querySelector(".sparkles");
      for (let i = 0; i < 14; i++) {
        const s = document.createElement("span");
        const angle = (i / 14) * 2 * Math.PI;
        s.textContent = i % 2 ? "✨" : "⭐";
        s.style.setProperty("--x", Math.round(Math.cos(angle) * 130) - 11 + "px");
        s.style.setProperty("--y", Math.round(Math.sin(angle) * 90) + "px");
        host.appendChild(s);
      }
      setTimeout(() => host.remove(), 1100);
    }

    async function open(animate) {
      button.disabled = true;
      error.hidden = true;
      try {
        await loadResult();
      } catch (e) {
        button.disabled = false;
        error.textContent = "Nie udało się wczytać wyniku (" + e.message + ").";
        error.hidden = false;
        return;
      }
      storage.set();
      hint.style.visibility = "hidden";
      if (animate && !calm) {
        button.classList.add("shaking");
        await wait(900);
        button.classList.replace("shaking", "open");
        sparkle();
        await wait(800);
      }
      button.remove();
      hint.remove();
      if (!animate) result.style.animation = "none";
      result.classList.add("shown");
    }

    if (storage.get()) open(false);
    else button.addEventListener("click", () => open(true));
  }
</script>
</body>
</html>
