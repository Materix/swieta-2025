<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Świąteczne losowanie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Caveat:wght@500;700&family=Comfortaa:wght@400;700&family=Courier+Prime:wght@400;700&family=Dancing+Script:wght@500;700&family=Great+Vibes&family=Kalam:wght@400;700&family=Lato:wght@400;700&family=Lobster&family=Merienda:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,600;1,500&display=swap">
<style>
  :root {
    --bg: #0f2a1d; --card: #fffaf0; --ink: #1d1d1b; --muted: #6b6b63;
    --red: #b3202a; --red-dark: #8c1820; --gold: #d9a441;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; align-content: center; gap: 28px; padding: 16px;
    background: radial-gradient(circle at 50% 0%, #1d4a33, var(--bg) 70%);
    font-family: Georgia, "Times New Roman", serif; color: var(--ink);
  }
  .card {
    width: 100%; max-width: 420px; background: var(--card); border-radius: 18px;
    padding: 32px 24px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,.4);
    border-top: 6px solid var(--red);
  }
  .tree { font-size: 48px; line-height: 1; }
  h1 { font-size: 26px; margin: 12px 0 4px; }
  .house {
    display: inline-block; margin: 4px 0 14px; padding: 6px 18px; border-radius: 999px;
    background: var(--red); color: #fff; font-size: 20px; font-weight: bold; letter-spacing: .5px;
  }
  .year { display: block; margin: 0 auto 24px; color: var(--muted); font-size: 14px; }
  .year select {
    font: inherit; font-size: 15px; color: var(--ink); background: #f3ead6;
    border: 1px solid var(--gold); border-radius: 999px; padding: 6px 12px; margin-left: 6px;
  }
  button {
    font: inherit; font-size: 18px; color: #fff; background: var(--red); border: 0;
    border-radius: 999px; padding: 14px 28px; cursor: pointer;
  }
  button:hover { background: var(--red-dark); }
  .result { display: none; }
  .result.shown { display: block; animation: pop .5s ease-out; }
  .label { color: var(--muted); margin: 0 0 8px; }
  .name { font-size: 40px; font-weight: bold; color: var(--red); margin: 0 0 8px; }
  .gift { font-size: 56px; }
  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
  a.person {
    display: block; padding: 12px; border-radius: 12px; text-decoration: none;
    color: var(--ink); background: #f3ead6; border: 1px solid var(--gold);
  }
  a.person:hover { background: #eadcbd; }
  .error { color: var(--red); }
  @keyframes pop { from { transform: scale(.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  /* Prezent do otwarcia */
  .present {
    position: relative; width: 140px; height: 150px; margin: 8px auto 20px; padding: 0;
    background: none; border-radius: 0; cursor: pointer;
  }
  .present:hover { background: none; }
  .present .box, .present .lid { position: absolute; left: 50%; background: var(--red); }
  .present .box { bottom: 0; width: 120px; height: 100px; margin-left: -60px; border-radius: 0 0 8px 8px; }
  .present .lid {
    bottom: 96px; width: 136px; height: 30px; margin-left: -68px; border-radius: 6px;
    background: var(--red-dark); transform-origin: 20% 100%;
  }
  .present .box::before, .present .lid::before {
    content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 20px; margin-left: -10px;
    background: var(--gold);
  }
  .present .bow {
    position: absolute; left: 50%; bottom: 100%; width: 60px; height: 30px; margin-left: -30px;
  }
  .present .bow::before, .present .bow::after {
    content: ""; position: absolute; bottom: -2px; width: 28px; height: 24px;
    border: 7px solid var(--gold); border-radius: 50% 50% 0 50%;
  }
  .present .bow::before { left: 0; transform: rotate(-20deg); }
  .present .bow::after { right: 0; transform: rotate(20deg) scaleX(-1); }
  .hint { color: var(--muted); font-size: 14px; margin: 0 0 4px; }
  .present.shaking { animation: shake .9s ease-in-out; }
  .present.open .lid { animation: lid-off .6s ease-in forwards; }
  .present.open .box { animation: box-out .5s .35s ease-in forwards; }
  @keyframes shake {
    0%, 100% { transform: rotate(0); }
    15% { transform: rotate(-8deg); } 30% { transform: rotate(8deg); }
    45% { transform: rotate(-10deg) scale(1.05); } 60% { transform: rotate(10deg) scale(1.05); }
    75% { transform: rotate(-5deg); } 90% { transform: rotate(4deg); }
  }
  @keyframes lid-off { to { transform: translate(60px, -90px) rotate(55deg); opacity: 0; } }
  @keyframes box-out { to { transform: translateY(20px) scale(.6); opacity: 0; } }
  .sparkles { position: relative; height: 0; }
  .sparkles span {
    position: absolute; left: 50%; top: -60px; font-size: 22px; opacity: 0;
    animation: burst 1s ease-out forwards;
  }
  @keyframes burst {
    0% { transform: translate(0, 0) scale(.4); opacity: 1; }
    100% { transform: translate(var(--x), var(--y)) scale(1); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .present.shaking, .present.open .lid, .present.open .box, .sparkles span, .result.shown { animation: none; }
  }

  /* Listy do Aniołka (karty .lc w dziewięciu wersjach .v1–.v9) */
  /* Modal z listem: na wierzchu strony, przewijany w środku, zamykany Esc, tłem albo przyciskiem. */
  dialog#letter {
    border: 0; padding: 0; background: transparent; color: inherit; overflow: visible;
    width: min(760px, calc(100% - 16px)); max-width: none; max-height: none;
  }
  dialog#letter::backdrop { background: rgba(5, 18, 12, .8); backdrop-filter: blur(3px); }
  body:has(dialog#letter[open]) { overflow: hidden; }
  .lm { max-height: calc(100dvh - 16px); overflow-y: auto; overscroll-behavior: contain; padding: 14px; }
  .lm-close {
    position: absolute; top: -4px; right: -4px; z-index: 5; width: 42px; height: 42px; padding: 0;
    border: 2px solid #fff; border-radius: 50%; font-size: 20px; line-height: 1; background: var(--red);
    box-shadow: 0 4px 12px rgba(0,0,0,.45);
  }
  .lm-close:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .letter {
    font-size: 28px; line-height: 1; padding: 4px 8px; margin-left: 2px; vertical-align: middle;
    background: #fff; border: 2px solid var(--gold); border-radius: 12px; cursor: pointer;
    box-shadow: 0 2px 0 rgba(0,0,0,.12); transition: transform .15s ease, background-color .15s ease;
  }
  .letter:hover { background: #fdf1d6; transform: scale(1.12) rotate(-6deg); }
  .letter:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .letter { transition: none; } .letter:hover { transform: none; } }
  .lc { text-align: left; animation: rise .6s ease-out; }
  .lc ul { display: block; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  @media (prefers-reduced-motion: reduce) { .lc { animation: none; } }
  /* Wejście do wszystkich listów (pod kartą losowania) i strona z kopertami (?widok=listy) */
  .more { margin: 26px 0 0; }
  a.to-letters {
    display: inline-flex; align-items: center; gap: 12px; padding: 10px 20px 10px 12px; border-radius: 999px;
    background: linear-gradient(#fffaf0, #f3e2bd); border: 1px solid var(--gold); color: var(--red-dark);
    text-decoration: none; font-size: 16px; box-shadow: 0 3px 0 rgba(140,24,32,.15), 0 6px 14px rgba(0,0,0,.12);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  a.to-letters:hover { transform: translateY(-2px); box-shadow: 0 5px 0 rgba(140,24,32,.15), 0 10px 18px rgba(0,0,0,.16); }
  a.to-letters:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  a.to-letters small { display: block; color: var(--muted); font-size: 12px; }
  a.to-letters span.t { text-align: left; line-height: 1.25; }
  .mini-env { position: relative; flex: none; width: 40px; height: 28px; border-radius: 4px; background: #ecd5a8; overflow: hidden;
    box-shadow: inset 0 0 0 1px rgba(120,80,30,.25); }
  .mini-env::before { content: ""; position: absolute; inset: 0 0 auto; height: 62%; background: #dcbd85; clip-path: polygon(0 0, 100% 0, 50% 100%); }
  .mini-env::after { content: ""; position: absolute; left: 50%; top: 62%; width: 11px; height: 11px; margin: -5.5px 0 0 -5.5px;
    border-radius: 50%; background: radial-gradient(circle at 35% 35%, #e0505a, var(--red-dark)); }
  a.to-letters:hover .mini-env { animation: wiggle .5s ease-in-out; }
  @keyframes wiggle { 25% { transform: rotate(-8deg); } 75% { transform: rotate(6deg); } }
  .card.wide { max-width: 680px; }
  .envs-h { margin: 22px 0 10px; font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: normal; }
  .envs { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 18px; }
  .env {
    position: relative; display: block; width: 100%; aspect-ratio: 3 / 2; padding: 0; border-radius: 8px; overflow: hidden;
    background: var(--env, #f1ddb3); color: #5a2d1a; cursor: pointer;
    box-shadow: inset 0 0 0 1px rgba(120,80,30,.18), 0 8px 16px rgba(0,0,0,.22); transition: transform .2s ease, box-shadow .2s ease;
  }
  .env:hover { background: var(--env, #f1ddb3); transform: translateY(-4px) rotate(-1.5deg); box-shadow: inset 0 0 0 1px rgba(120,80,30,.18), 0 14px 22px rgba(0,0,0,.28); }
  .env:nth-child(even):hover { transform: translateY(-4px) rotate(1.5deg); }
  .env:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  .env::before { /* klapa */
    content: ""; position: absolute; inset: 0 0 auto; height: 52%; z-index: 1;
    background: linear-gradient(rgba(0,0,0,.09), rgba(0,0,0,.09)), var(--env, #f1ddb3); clip-path: polygon(0 0, 100% 0, 50% 100%);
    filter: drop-shadow(0 2px 1px rgba(0,0,0,.2));
  }
  .env::after { /* boczne zakładki */
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(to top right, rgba(0,0,0,.05) 50%, transparent 50.5%) left bottom / 50% 100% no-repeat,
                linear-gradient(to top left, rgba(0,0,0,.05) 50%, transparent 50.5%) right bottom / 50% 100% no-repeat;
  }
  .env .seal {
    position: absolute; left: 50%; top: 52%; z-index: 2; width: 38px; height: 38px; margin: -19px 0 0 -19px; border-radius: 50%;
    display: grid; place-items: center; font-size: 17px; line-height: 1; color: #fde3a7;
    background: radial-gradient(circle at 35% 30%, #e0505a, var(--red) 55%, var(--red-dark));
    box-shadow: 0 0 0 3px rgba(179,32,42,.25), 0 3px 6px rgba(0,0,0,.35); transition: transform .2s ease;
  }
  .env:hover .seal { transform: scale(1.12) rotate(-12deg); }
  .env .to {
    position: absolute; left: 6px; right: 6px; bottom: 7%; z-index: 2; text-align: center;
    font-family: "Caveat", cursive; font-weight: 700; font-size: 1.45rem; line-height: 1.05;
  }
  .env .to small { display: block; font-family: Georgia, serif; font-weight: normal; font-size: 11px; color: #8a6a4a; }
  .env.empty { cursor: default; filter: grayscale(.85); opacity: .55; }
  .env.empty:hover { transform: none; box-shadow: inset 0 0 0 1px rgba(120,80,30,.18), 0 8px 16px rgba(0,0,0,.22); }
  .env.empty .seal { background: #9a948a; box-shadow: 0 2px 4px rgba(0,0,0,.25); }
  .env.empty:hover .seal { transform: none; }
  @media (max-width: 480px) {
    .envs { grid-template-columns: 1fr 1fr; gap: 14px; }
    .env .to { font-size: 1.15rem; }
    .env::before { height: 42%; }
    .env .seal { top: 42%; width: 30px; height: 30px; margin: -15px 0 0 -15px; font-size: 14px; }
    .env .to { bottom: 5%; }
    .env .to small { font-size: 10px; }
  }
  .envs-note { color: var(--muted); font-size: 14px; margin: 18px 0 0; }
  a.back { display: inline-block; margin-top: 24px; color: var(--red-dark); font-size: 16px; text-underline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) {
    a.to-letters, .env, .env .seal { transition: none; }
    a.to-letters:hover, .env:hover, .env:nth-child(even):hover, .env:hover .seal { transform: none; }
    a.to-letters:hover .mini-env { animation: none; }
  }
/* ---------- wspólny szkielet karty ---------- */
.lc { position: relative; padding: 34px 38px 26px; min-width: 0; overflow-wrap: anywhere; }
.lc h3 { margin: 0; }
.lc .for { margin: 0; }
.lc ul { list-style: none; margin: 0; padding: 0; }
.lc a { text-underline-offset: 3px; }
.stk { position: absolute; font-size: 2.1rem; line-height: 1; filter: drop-shadow(0 2px 2px rgba(0,0,0,.3)); pointer-events: none; }
.v1 .stk, .v2 .stk { --ov: 4px; }

/* ---------- 1 Pergamin ---------- */
.v1 { color: #3b2a1a; border-radius: 4px; font-family: "Caveat", cursive; font-size: 1.45rem; line-height: 1.35; padding-top: 36px;
  background: radial-gradient(ellipse at 0 0, rgba(120,70,20,.35), transparent 38%), radial-gradient(ellipse at 100% 100%, rgba(120,70,20,.35), transparent 40%), radial-gradient(ellipse at 100% 0, rgba(120,70,20,.18), transparent 30%), #ecd9a8;
  box-shadow: 0 14px 34px rgba(0,0,0,.5);
  clip-path: polygon(0 1%, 4% 0, 9% 1.2%, 15% 0, 22% 1%, 30% 0, 38% 1.3%, 47% 0, 55% 1%, 63% 0, 71% 1.2%, 80% 0, 88% 1%, 94% 0, 100% 1.2%, 99.3% 30%, 100% 62%, 99.2% 100%, 92% 99%, 84% 100%, 75% 99%, 66% 100%, 57% 98.8%, 47% 100%, 38% 99%, 28% 100%, 19% 99%, 9% 100%, 0 99%, .7% 70%, 0 40%); }
.v1 .for { font-size: 1rem; letter-spacing: .06em; text-transform: uppercase; color: #8a5a2b; font-family: var(--f-ui); font-weight: 700; }
.v1 h3 { font-size: 2.5rem; line-height: 1.05; font-weight: 700; color: #6e1f1f; padding-right: 60px; }
.v1 .lead2 { margin: 6px 0 10px; }
.v1 li { padding-left: 1.7rem; position: relative; margin-bottom: 4px; }
.v1 li::before { content: "✦"; position: absolute; left: 0; top: .2rem; color: #b3202a; font-size: 1.05rem; }
.v1 a { color: #1f4f7a; text-decoration-thickness: 2px; }

/* ---------- 2 Zimowa noc ---------- */
.v2 { color: #eef2ff; border-radius: 22px; overflow: hidden; font-family: "Lato", sans-serif; line-height: 1.55; padding-top: 24px;
  background: radial-gradient(1.5px 1.5px at 12% 18%, #fff, transparent 60%), radial-gradient(1.5px 1.5px at 70% 12%, #fff, transparent 60%), radial-gradient(2px 2px at 86% 30%, #fff, transparent 60%), radial-gradient(1.5px 1.5px at 30% 44%, #fff, transparent 60%), radial-gradient(1.5px 1.5px at 92% 62%, #fff, transparent 60%), radial-gradient(2px 2px at 8% 72%, #fff, transparent 60%), radial-gradient(1.5px 1.5px at 58% 86%, #fff, transparent 60%), radial-gradient(1.5px 1.5px at 44% 6%, #fff, transparent 60%), linear-gradient(170deg, #1b2a5c 0%, #0f1b3d 55%, #0a1230 100%);
  box-shadow: 0 14px 34px rgba(0,0,0,.55), inset 0 0 0 1px rgba(226,180,87,.45); }
.v2 .angel { display: block; width: 66px; margin: 0 auto 4px; filter: drop-shadow(0 0 10px rgba(226,180,87,.7)); }
.v2 .for { text-align: center; font-size: .75rem; letter-spacing: .22em; text-transform: uppercase; color: #e2b457; }
.v2 h3 { font-family: "Playfair Display", serif; font-style: italic; font-weight: 500; text-align: center; font-size: 2.1rem; margin-bottom: 12px; color: #fff; }
.v2 li { padding: 9px 0 9px 2rem; position: relative; border-bottom: 1px dashed rgba(226,180,87,.35); }
.v2 li:last-child { border-bottom: 0; }
.v2 li::before { content: "★"; position: absolute; left: .25rem; color: #e2b457; }
.v2 a { color: #ffd98a; }

/* ---------- 3 Kolorowy papier ---------- */
.v3 { color: #2b2b2b; border-radius: 26px; font-family: "Merienda", cursive; font-size: .98rem; line-height: 1.5; padding-top: 40px;
  background: radial-gradient(circle, rgba(179,32,42,.14) 2.5px, transparent 3px) 0 0/22px 22px, #fff6e3; box-shadow: 0 14px 34px rgba(0,0,0,.45); }
.v3::before { content: ""; position: absolute; left: 50%; top: -12px; width: 120px; height: 28px; transform: translateX(-50%) rotate(-3deg); background: repeating-linear-gradient(45deg, #d9a441 0 8px, #f0cf85 8px 16px); opacity: .92; border-radius: 3px; }
.v3 h3 { font-family: "Lobster", cursive; font-weight: 400; font-size: 2.4rem; color: #b3202a; line-height: 1.1; padding-right: 56px; }
.v3 .for { margin-bottom: 12px; color: #2f6b4a; font-weight: 700; }
.v3 li { position: relative; padding: 3px 0 3px 1.6rem; }
.v3 li::before { content: "✿"; position: absolute; left: 0; color: var(--ac, #b3202a); }
.v3 a { color: #1c5fa8; font-weight: 700; }

/* ---------- 4 Zeszyt w kratkę ---------- */
.v4 { color: #1c2f6b; border-radius: 6px; font-family: "Kalam", cursive; font-size: 1.15rem; line-height: 28px; padding: 28px 22px 70px 56px;
  background: linear-gradient(90deg, transparent 43px, #e0525a 43px, #e0525a 45px, transparent 45px), repeating-linear-gradient(#fdfdf8 0 27px, #bcd3ee 27px 28px); background-color: #fdfdf8; box-shadow: 0 14px 34px rgba(0,0,0,.45); }
.v4::before { content: ""; position: absolute; left: 10px; top: 24px; bottom: 24px; width: 14px; background: radial-gradient(circle at 7px 7px, #14251c 5px, #9aa0a6 6px, transparent 7px) 0 0/14px 36px repeat-y; }
.v4 .for { font-size: .85rem; color: #6a7aa8; text-transform: uppercase; letter-spacing: .08em; }
.v4 h3 { font-size: 2rem; line-height: 56px; font-weight: 700; color: #1c2f6b; }
.v4 li { position: relative; padding-left: 1.4rem; }
.v4 li::before { content: "–"; position: absolute; left: 0; color: #e0525a; font-weight: 700; }
.v4 a { color: #0f6e4b; }

/* ---------- 5 Kraft ---------- */
.v5 { color: #3a2a1e; border-radius: 6px; font-family: "Courier Prime", monospace; font-size: .98rem; line-height: 1.55; padding-top: 52px;
  background: repeating-linear-gradient(0deg, rgba(90,55,25,.05) 0 2px, transparent 2px 5px), radial-gradient(ellipse at 20% 10%, rgba(255,235,200,.35), transparent 55%), #b98a5c; box-shadow: 0 14px 34px rgba(0,0,0,.5); }
.v5::before { content: ""; position: absolute; left: 22px; right: 22px; top: 22px; border-top: 3px dashed #f5ecd9; opacity: .9; }
.v5 .tagb { display: inline-block; background: #fbf6ea; padding: 10px 16px 10px 22px; clip-path: polygon(10px 0, 100% 0, 100% 100%, 10px 100%, 0 50%); margin: 0 0 10px; box-shadow: 0 2px 0 rgba(0,0,0,.15); }
.v5 .for { font-size: .72rem; letter-spacing: .16em; text-transform: uppercase; color: #8a5a2b; }
.v5 h3 { font-size: 1.55rem; line-height: 1.1; font-weight: 700; color: #6e1f1f; }
.v5 ul { background: rgba(251,246,234,.92); border-radius: 4px; padding: 10px 14px; }
.v5 li { padding: 6px 0 6px 1.3rem; position: relative; border-bottom: 1px solid rgba(90,55,25,.2); }
.v5 li:last-child { border-bottom: 0; }
.v5 li::before { content: "▸"; position: absolute; left: 0; color: #b3202a; }
.v5 a { color: #1f4f7a; }

/* ---------- 6 Czerwony aksamit ---------- */
.v6 { color: #f7e9c8; border-radius: 10px; font-family: "Playfair Display", serif; font-size: 1.02rem; line-height: 1.55; padding-top: 34px; text-align: center;
  background: radial-gradient(ellipse at 50% 0, #a3202b, transparent 70%), repeating-linear-gradient(45deg, rgba(0,0,0,.08) 0 2px, transparent 2px 6px), #7a1019; box-shadow: 0 14px 34px rgba(0,0,0,.55); }
.v6::before { content: ""; position: absolute; inset: 10px; border: 2px solid #d9a441; border-radius: 6px; box-shadow: inset 0 0 0 4px #7a1019, inset 0 0 0 5px rgba(217,164,65,.7); pointer-events: none; }
.v6 .for { font-size: .7rem; letter-spacing: .26em; text-transform: uppercase; color: #e8c06b; font-family: var(--f-ui); }
.v6 h3 { font-family: "Great Vibes", cursive; font-weight: 400; font-size: 3.2rem; line-height: 1.1; color: #ffd98a; margin: 2px 0 10px; }
.v6 ul { display: grid; gap: 7px; }
.v6 li::before, .v6 li::after { content: "❖"; color: #d9a441; font-size: .7rem; margin: 0 .6em; vertical-align: .1em; }
.v6 a { color: #ffd98a; }

/* ---------- 7 Lód ---------- */
.v7 { color: #12385a; border-radius: 28px; font-family: "Comfortaa", sans-serif; font-size: .96rem; line-height: 1.55; padding-top: 32px;
  background: radial-gradient(circle at 85% 10%, rgba(255,255,255,.9), transparent 35%), linear-gradient(160deg, #dff1ff, #a9d3f2 60%, #84bde6); box-shadow: 0 14px 34px rgba(0,0,0,.4), inset 0 0 0 2px rgba(255,255,255,.7); }
.v7::before { content: "❄"; position: absolute; left: 14px; top: 6px; font-size: 3.6rem; color: rgba(255,255,255,.75); }
.v7 .for { text-align: right; padding-right: 56px; font-size: .74rem; letter-spacing: .12em; text-transform: uppercase; color: #3b78a6; font-weight: 700; }
.v7 h3 { font-size: 2.1rem; font-weight: 700; line-height: 1.15; margin: 8px 0 12px; padding-left: 52px; color: #0e2f4f; }

/* ---------- 8 Tablica w lesie ---------- */
.v8 { color: #f0ead8; border-radius: 14px; font-family: "Amatic SC", cursive; font-weight: 700; font-size: 1.7rem; line-height: 1.2; letter-spacing: .02em; padding-top: 30px;
  background: linear-gradient(0deg, rgba(8,28,18,.9) 0 var(--band, 26px), transparent var(--band, 26px)), repeating-conic-gradient(from 0deg at 50% 100%, transparent 0 8deg, rgba(255,255,255,.025) 8deg 16deg), #1f4a34;
  box-shadow: 0 14px 34px rgba(0,0,0,.55), inset 0 0 0 6px #6b4a2b, inset 0 0 0 7px rgba(0,0,0,.35); padding-inline: 32px; }
.v8 .for { font-size: 1.25rem; color: #f2c14e; letter-spacing: .1em; }
.v8 h3 { font-size: 3.2rem; line-height: 1; margin: 0 0 8px; color: #fff; text-shadow: 0 0 6px rgba(255,255,255,.25); padding-right: 52px; }
.v8 li { padding-left: 1.6rem; position: relative; }
.v8 li::before { content: "🌲"; position: absolute; left: 0; font-size: 1.1rem; top: .1rem; }
.v8 a { color: #f2c14e; }

/* ---------- 9 Kartka papieru ---------- */
.v9 { color: #2b2b2b; border-radius: 2px; padding-top: 38px; line-height: 28px;
  background: var(--pat, none), var(--paper, #fffefa); box-shadow: 0 1px 1px rgba(0,0,0,.2), 0 14px 28px rgba(0,0,0,.4); transform: rotate(-.6deg); }
.v9::before { content: "📌"; position: absolute; left: 50%; top: -10px; font-size: 1.6rem; transform: translateX(-50%) rotate(8deg); filter: drop-shadow(0 2px 1px rgba(0,0,0,.3)); }
.v9 .for { font-family: var(--f-ui); font-size: .72rem; letter-spacing: .16em; text-transform: uppercase; color: #77777a; line-height: 1.2; }
.v9 h3 { line-height: 1.15; margin: 4px 0 8px; padding-right: 56px; }
.v9 li { position: relative; padding-left: 1.3rem; }
.v9 li::before { content: "•"; position: absolute; left: .2rem; color: var(--ac, #1c2f6b); font-weight: 700; }
.v9 a { color: #1f4f7a; }

/* ---------- miksowanie: czcionka, kolor akcentu (zmienne ustawia skrypt) ---------- */
.v1 { font-family: var(--ff, "Caveat", cursive); font-size: calc(1.45rem * var(--sc, 1)); font-weight: var(--bw, 400); }
.v1 h3 { font-family: var(--hf, "Caveat", cursive); font-size: calc(2.5rem * var(--hsc, 1)); color: var(--ac, #6e1f1f); font-weight: var(--hw, 700); }
.v1 li::before { color: var(--ac, #b3202a); }
.v2 { font-family: var(--ff, "Lato", sans-serif); font-size: calc(1rem * var(--sc, 1)); font-weight: var(--bw, 400); }
.v2 h3 { font-family: var(--hf, "Playfair Display", serif); font-size: calc(2.1rem * var(--hsc, 1)); color: var(--ac, #fff); font-weight: var(--hw, 500); font-style: var(--hs, italic); }
.v2 li::before { color: var(--ac, #e2b457); }
.v3 { font-family: var(--ff, "Merienda", cursive); font-size: calc(.98rem * var(--sc, 1)); font-weight: var(--bw, 400); }
.v3 h3 { font-family: var(--hf, "Lobster", cursive); font-size: calc(2.4rem * var(--hsc, 1)); color: var(--ac, #b3202a); font-weight: var(--hw, 400); }
.v4 { font-family: var(--ff, "Kalam", cursive); font-size: calc(1.15rem * var(--sc, 1)); font-weight: var(--bw, 400); }
.v4 h3 { font-family: var(--hf, "Kalam", cursive); font-size: calc(2rem * var(--hsc, 1)); color: var(--ac, #1c2f6b); font-weight: var(--hw, 700); }
.v5 { font-family: var(--ff, "Courier Prime", monospace); font-size: calc(.98rem * var(--sc, 1)); font-weight: var(--bw, 400); }
.v5 h3 { font-family: var(--hf, "Courier Prime", monospace); font-size: calc(1.55rem * var(--hsc, 1)); color: var(--ac, #6e1f1f); font-weight: var(--hw, 700); }
.v6 { font-family: var(--ff, "Playfair Display", serif); font-size: calc(1.02rem * var(--sc, 1)); font-weight: var(--bw, 400); }
.v6 h3 { font-family: var(--hf, "Great Vibes", cursive); font-size: calc(3.2rem * var(--hsc, 1)); color: var(--ac, #ffd98a); font-weight: var(--hw, 400); }
.v7 { font-family: var(--ff, "Comfortaa", sans-serif); font-size: calc(.96rem * var(--sc, 1)); font-weight: var(--bw, 400); }
.v7 h3 { font-family: var(--hf, "Comfortaa", sans-serif); font-size: calc(2.1rem * var(--hsc, 1)); color: var(--ac, #0e2f4f); font-weight: var(--hw, 700); }
.v8 { font-family: var(--ff, "Amatic SC", cursive); font-size: calc(1.7rem * var(--sc, 1)); font-weight: var(--bw, 700); }
.v8 h3 { font-family: var(--hf, "Amatic SC", cursive); font-size: calc(3.2rem * var(--hsc, 1)); color: var(--ac, #fff); font-weight: var(--hw, 700); }
.v9 { font-family: var(--ff, "Kalam", cursive); font-size: calc(1.1rem * var(--sc, 1)); font-weight: var(--bw, 400); }
.v9 h3 { font-family: var(--hf, "Caveat", cursive); font-size: calc(2.3rem * var(--hsc, 1)); color: var(--ac, #1c2f6b); font-weight: var(--hw, 700); }
.lc.pad-b { padding-bottom: 54px; }
.lc.no-stk { padding-bottom: 26px; }
.lc h3 + ul, .lc .lead2 + ul { margin-top: 10px; }
.lc p.t { margin: 0 0 1em; }
.lc ul + p.t { margin-top: 1em; }
.lc ul { margin-bottom: 0; }
.v8.pad-b { --band: 54px; }
.v4 p.t, .v9 p.t { margin-bottom: 28px; }
.v4 ul + p.t, .v9 ul + p.t { margin-top: 28px; }
</style>
</head>
<body>
<main class="card" id="app">
  <div class="tree">🎄</div>
  <h1>Świąteczne losowanie</h1>
  <div class="house" id="house"></div>
  <label class="year">Rok losowania <select id="year"></select></label>
  <div id="content"></div>
</main>
<dialog id="letter" aria-label="List do Aniołka">
  <button type="button" class="lm-close" aria-label="Zamknij list">✕</button>
  <div class="lm"></div>
</dialog>
<script>
  // Domy: uczestnicy i lata, dla których istnieje katalog <dom>/<rok> — dopisz nowy rok po losowaniu.
  const HOUSES = {
    zary: {
      name: "Żary",
      people: ["Agnieszka", "Gabrysia", "Krzysztof", "Michal", "Ola"],
      years: ["2024", "2025", "2026"],
    },
    beczarka: {
      name: "Bęczarka",
      people: ["Agula-Bartula", "Ola-Michal", "Kasia-Pawel", "Julianka-Piotrek", "Rodzice"],
      years: ["2025", "2026"],
      children: ["Jozek", "Wandzia", "Ritka", "Wojtek"],   // dzieci (listy: <dom>/listy/<rok>/<Imię>.txt)
    },
  };
  const DISPLAY = {
    Michal: "Michał",
    "Agula-Bartula": "Agula i Bartula", "Ola-Michal": "Ola i Michał", "Kasia-Pawel": "Kasia i Paweł",
    "Julianka-Piotrek": "Julianka i Piotrek", Rodzice: "Kasia i Staś", Jozek: "Józek",
  };
  const show = (p) => DISPLAY[p] || p;

  const params = new URLSearchParams(location.search);
  const houseId = HOUSES[params.get("dom")] ? params.get("dom") : "zary";
  const house = HOUSES[houseId];
  const YEARS = house.years;
  const thisYear = String(new Date().getFullYear());
  const defaultYear = YEARS.includes(thisYear)
    ? thisYear
    : YEARS.filter((y) => y <= thisYear).pop() || YEARS[YEARS.length - 1];

  const year = YEARS.includes(params.get("rok")) ? params.get("rok") : defaultYear;
  const person = house.people.find((p) => p === params.get("osoba"));
  // ?widok=listy: wszystkie listy do Aniołka z danego roku (tylko domy z listami, czyli z dziećmi).
  const lettersView = params.get("widok") === "listy" && !!house.children;
  const content = document.getElementById("content");
  document.getElementById("house").textContent = "🏠 " + house.name;
  document.title = "Świąteczne losowanie — " + house.name;
  // Dom zawsze w adresie (stare linki bez ?dom= trafiają do Żar).
  if (params.get("dom") !== houseId) {
    params.set("dom", houseId);
    history.replaceState(null, "", "?" + params.toString());
  }
  const yearSelect = document.getElementById("year");
  for (const y of [...YEARS].reverse()) yearSelect.add(new Option(y, y, false, y === year));
  yearSelect.addEventListener("change", () => {
    if (yearSelect.value === defaultYear) params.delete("rok");
    else params.set("rok", yearSelect.value);
    location.search = params.toString();
  });

  /* ---------- Listy do Aniołka ---------- */
const STYLES = [
  { id: 1, name: "Pergamin" }, { id: 2, name: "Zimowa noc" }, { id: 3, name: "Kolorowy papier" }, { id: 4, name: "Zeszyt w kratkę" },
  { id: 5, name: "Kraft" }, { id: 6, name: "Czerwony aksamit" }, { id: 7, name: "Lód" }, { id: 8, name: "Tablica w lesie" }, { id: 9, name: "Kartka papieru" },
];
/* ----- miksowanie: pule czcionek (sc = skala optyczna), akcentów i papieru ----- */
const F = {
  Caveat: ['"Caveat",cursive', 1.25, 400, 700], Kalam: ['"Kalam",cursive', 1, 400, 700], Merienda: ['"Merienda",cursive', .88, 400, 700],
  Courier: ['"Courier Prime",monospace', .9, 400, 700], Comfortaa: ['"Comfortaa",sans-serif', .88, 400, 700], Lato: ['"Lato",sans-serif', 1, 400, 700],
  Playfair: ['"Playfair Display",serif', .95, 400, 600], Dancing: ['"Dancing Script",cursive', 1.15, 500, 700], Amatic: ['"Amatic SC",cursive', 1.45, 700, 700],
  Lobster: ['"Lobster",cursive', 1.1, 400, 400], Vibes: ['"Great Vibes",cursive', 1.5, 400, 400],
};   // [css, skala, waga tekstu, waga nagłówka]
const BODY_POOL = ["Caveat", "Kalam", "Merienda", "Courier", "Comfortaa", "Lato", "Playfair", "Dancing", "Amatic"];
const HEAD_POOL = ["Caveat", "Kalam", "Merienda", "Comfortaa", "Playfair", "Dancing", "Amatic", "Lobster", "Vibes"];
const DEFAULT_FONTS = [["Caveat", "Caveat"], ["Lato", "Playfair"], ["Merienda", "Lobster"], ["Kalam", "Kalam"], ["Courier", "Courier"], ["Playfair", "Vibes"], ["Comfortaa", "Comfortaa"], ["Amatic", "Amatic"], ["Kalam", "Caveat"]];
const ACC_LIGHT = ["#6e1f1f", "#b3202a", "#1c2f6b", "#1f5a3d", "#5a2d82", "#8a4b12"];
const ACC_DARK = ["#ffd98a", "#ffb3c1", "#9fe0c0", "#9ec9ff", "#ffffff", "#f4a261"];
const DARK_STYLES = [1, 5, 7];   // indeksy: Zimowa noc, Czerwony aksamit, Tablica w lesie
const PAPER = ["#fffefa", "#fbf3dc", "#e9f6ee", "#fde8ee", "#e6f1fb", "#fff8c9"];
const PATTERN = [
  "none",
  "repeating-linear-gradient(transparent 0 27px, rgba(70,110,170,.3) 27px 28px)",
  "linear-gradient(rgba(70,110,170,.22) 1px, transparent 1px) 0 0/20px 20px, linear-gradient(90deg, rgba(70,110,170,.22) 1px, transparent 1px) 0 0/20px 20px",
  "radial-gradient(rgba(60,60,60,.22) 1px, transparent 1.6px) 0 0/18px 18px",
];
function hash(str) { let h = 2166136261; for (const c of str) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function mixVars(styleIdx, key) {
  const h = hash(key);
  const bf = F[BODY_POOL[h % BODY_POOL.length]], hf = F[HEAD_POOL[(h >>> 4) % HEAD_POOL.length]];
  const [dbn, dhn] = DEFAULT_FONTS[styleIdx], db = F[dbn], dh = F[dhn];
  const accs = DARK_STYLES.includes(styleIdx) ? ACC_DARK : ACC_LIGHT;
  let v = `--ff:${bf[0]};--sc:${(bf[1] / db[1]).toFixed(3)};--bw:${bf[2]};--hf:${hf[0]};--hsc:${(hf[1] / dh[1]).toFixed(3)};--hw:${hf[3]};--hs:normal;--ac:${accs[(h >>> 8) % accs.length]};`;
  if (styleIdx === 8) v += `--paper:${PAPER[(h >>> 12) % PAPER.length]};--pat:${PATTERN[(h >>> 16) % PATTERN.length]};`;
  return v;
}

function parseLetter(t) {
  const blocks = []; let para = [], ul = null;
  const flushP = () => { if (para.length) { blocks.push({ p: para.join("\n") }); para = []; } };
  for (const line of t.split("\n")) {
    if (/^- /.test(line)) { flushP(); if (!ul) { ul = []; blocks.push({ ul }); } ul.push(line.slice(2)); }
    else if (line.trim() === "") { flushP(); ul = null; }
    else { ul = null; para.push(line); }
  }
  flushP(); return blocks;
}

/* ----- naklejki z treści (maks. 3) ----- */
const RULES = [
  [/klock|lego/i, "🧱"], [/książk|bajk|czyta|album|komiks/i, "📚"], [/kredk|farb|mazak|rysow/i, "🎨"], [/piłk|football|sport/i, "⚽"],
  [/rower|hulajn/i, "🚲"], [/planszow|puzzl|układank/i, "🧩"], [/miś|pluszak|lalk/i, "🧸"], [/koni|kuc|stajni/i, "🐴"],
  [/samochod|samochód|pociąg|autk/i, "🚂"], [/skarpet|kapcie|czapk|szalik|rękawic|piżam|sweter/i, "🧦"], [/czekolad|słodycz|pierni|ciast/i, "🍫"],
  [/perfum|kosmetyk|krem/i, "💄"], [/kawa|kawy|herbat|kubk/i, "☕"], [/słuchawk|muzyk|gitar|głośnik/i, "🎧"], [/konsol|telefon|tablet|komputer/i, "🎮"],
  [/kosmos|rakiet|gwiazd/i, "🚀"], [/pies|kot|zwierz/i, "🐶"], [/bransolet|biżuter|naszyjnik|kolczyk/i, "📿"], [/kino|film|bilety/i, "🎬"],
  [/kwiat|ogród|rośl/i, "🌷"], [/wino|piwo|drink/i, "🍷"], [/narzędzi|młotek|wiertark/i, "🔧"], [/podróż|wycieczk|góry|nocleg|walizk/i, "🧳"],
  [/talerz|szklank|naczyn/i, "🍽️"], [/prześcierad|pościel|koc\b/i, "🛏️"], [/basen|term/i, "♨️"], [/marakas|grzechot/i, "🎶"], [/straż|pożarn/i, "🚒"], [/choink/i, "🎄"], [/teatr/i, "🎭"], [/świec|zapach/i, "🕯️"], [/spa|masaż|relaks/i, "🛁"], [/plecak|szkoł|zeszyt|piór/i, "🎒"], [/zdjęci|aparat/i, "📷"], [/kalendarz|zegar/i, "🗓️"],
];
/* Losowe (ale stałe dla danej listy i roku) miejsce, obrót i rozmiar każdej naklejki. */
const SLOTS = ["tr", "bm", "bl", "br", "l", "r"];
function placeStickers(emojis, key) {
  const rnd = (k) => (hash(key + "|" + k) % 1000) / 1000;
  const slots = [...SLOTS].sort((a, b) => rnd(a) - rnd(b)).slice(0, emojis.length);
  let bottom = false;
  const html = emojis.map((e, i) => {
    const sl = slots[i], r = (k) => rnd(sl + k);
    const rot = Math.round(-22 + r("rot") * 44), size = (1.8 + r("sz") * .7).toFixed(2);
    let pos;
    if (sl === "tr") pos = `top:${8 + Math.round(r("a") * 8)}px;right:${10 + Math.round(r("b") * 10)}px`;
    else if (sl === "bm") pos = `bottom:${6 + Math.round(r("a") * 5)}px;left:${38 + Math.round(r("b") * 18)}%`;
    else if (sl === "bl") pos = `bottom:${6 + Math.round(r("a") * 5)}px;left:${12 + Math.round(r("b") * 8)}px`;
    else if (sl === "br") pos = `bottom:${6 + Math.round(r("a") * 5)}px;right:${12 + Math.round(r("b") * 12)}px`;
    else if (sl === "l") pos = `left:calc(var(--ov,-10px));top:${25 + Math.round(r("a") * 50)}%`;
    else pos = `right:calc(var(--ov,-10px));top:${30 + Math.round(r("a") * 50)}%`;
    if (sl[0] === "b") bottom = true;
    return `<span class="stk" style="${pos};font-size:${size}rem;transform:rotate(${rot}deg)">${e}</span>`;
  }).join("");
  return { html, bottom };
}
function stickers(items, key) {
  const found = [];
  for (const it of items) for (const [re, e] of RULES) if (re.test(it) && !found.includes(e)) { found.push(e); break; }
  if (found.length > 3) return found.sort((a, b) => hash(key + a) - hash(key + b)).slice(0, 3);
  return found;
}


const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
// [tekst](https://adres) albo goły adres https://... zamieniają się w link.
const linkify = (s) => esc(s)
  .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
  .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>');
const ANGEL = '<svg class="angel" viewBox="0 0 80 70" role="img" aria-label="Aniołek"><ellipse cx="40" cy="9" rx="14" ry="4" fill="none" stroke="#e2b457" stroke-width="2.5"/><path d="M40 26 C26 14 8 16 4 30 C14 34 28 34 36 38 Z" fill="#f4f7ff"/><path d="M40 26 C54 14 72 16 76 30 C66 34 52 34 44 38 Z" fill="#f4f7ff"/><circle cx="40" cy="22" r="9" fill="#ffe6c4"/><path d="M31 66 C31 44 36 34 40 34 C44 34 49 44 49 66 Z" fill="#f4f7ff"/></svg>';

// Wersja karty: lista pary i lista dziecka dostają różne wersje; rok przesuwa przydział.
function styleOf(kind, idx, y) {
  const off = Number(y) % STYLES.length;
  return (idx + (kind === "child" ? house.people.length : 0) + off) % STYLES.length;
}
function listCard(styleIdx, who, blocks, y) {
  const v = styleIdx + 1;
  const ul0 = blocks.find((b) => b.ul), items = ul0 ? ul0.ul : blocks.flatMap((b) => b.p.split("\n"));
  const key = who + "|" + y + "|0";
  const sty = mixVars(styleIdx, key).replace(/"/g, "'");
  const ps = placeStickers(stickers(items, key), key);
  const body = blocks.map((b) => b.ul
    ? `<ul>${b.ul.map((t) => `<li>${linkify(t)}</li>`).join("")}</ul>`
    : `<p class="t">${linkify(b.p).replace(/\n/g, "<br>")}</p>`).join("");
  let head = `<h3>${esc(show(who))}</h3>`;
  if (v === 2) head = ANGEL + head;
  if (v === 5) head = `<div class="tagb">${head}</div>`;
  return `<article class="lc v${v}${ps.bottom ? " pad-b" : " no-stk"}" style="${sty}">${head}${body}${ps.html}</article>`;
}
async function fetchLetter(name) {
  try {
    const res = await fetch(houseId + "/listy/" + year + "/" + name + ".txt", { cache: "no-store" });
    if (!res.ok) return null;
    const text = (await res.text()).trim();
    return text ? parseLetter(text) : null;
  } catch (e) { return null; }
}
// Okno modalne z listem: na wierzchu strony; zamyka je ✕, Esc albo klik w tło.
function openLetter(kind, who, blocks) {
  const dialog = document.getElementById("letter"), holder = dialog.querySelector(".lm");
  if (!dialog.dataset.ready) {
    dialog.dataset.ready = "1";
    dialog.querySelector(".lm-close").addEventListener("click", () => dialog.close());
    dialog.addEventListener("click", (ev) => { if (ev.target === dialog) dialog.close(); });   // klik w tło
    dialog.addEventListener("close", () => { holder.innerHTML = ""; });
  }
  const idx = (kind === "pair" ? house.people : house.children).indexOf(who);
  holder.innerHTML = listCard(styleOf(kind, idx, year), who, blocks, year);
  holder.scrollTop = 0;
  dialog.setAttribute("aria-label", "List do Aniołka: " + show(who));
  dialog.showModal();
}
// Obok imienia wylosowanej pary i dziecka pojawia się ikonka listu (tylko gdy lista istnieje).
async function addLetterIcons(slots) {
  if (!house.children) return;
  await Promise.all(slots.map(async ([kind, who, nameEl]) => {
    const blocks = await fetchLetter(who);
    if (!blocks) return;
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "letter";
    btn.textContent = "✉️";
    btn.title = "List do Aniołka: " + show(who);
    btn.setAttribute("aria-label", "Otwórz list do Aniołka: " + show(who));
    btn.setAttribute("aria-haspopup", "dialog");
    btn.addEventListener("click", () => openLetter(kind, who, blocks));
    nameEl.append(" ", btn);
  }));
}
// Strona ze wszystkimi listami: koperty z pieczęcią, kliknięcie otwiera list w tym samym modalu.
const ENV_PAIR = ["#f1ddb3", "#efd6a6", "#f3e3c3", "#ead0a0", "#f0dcb8"];
const ENV_CHILD = ["#fbdde6", "#dcebfb", "#dff3e6", "#fff1c2"];
async function showAllLetters() {
  const app = document.getElementById("app");
  app.classList.add("wide");
  app.querySelector("h1").textContent = "Listy do Aniołka";
  app.querySelector(".tree").textContent = "👼";
  document.title = "Listy do Aniołka — " + house.name;
  content.innerHTML = '<h2 class="envs-h">Pary</h2><div class="envs" data-kind="pair"></div>' +
    '<h2 class="envs-h">Dzieci</h2><div class="envs" data-kind="child"></div><p class="envs-note" hidden></p>';
  const groups = [["pair", house.people, ENV_PAIR, "✿"], ["child", house.children, ENV_CHILD, "★"]];
  let found = 0;
  await Promise.all(groups.flatMap(([kind, list, colors, mark]) => {
    const box = content.querySelector(`.envs[data-kind="${kind}"]`);
    return list.map(async (who, i) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "env";
      btn.style.setProperty("--env", colors[i % colors.length]);
      btn.innerHTML = `<span class="seal" aria-hidden="true">${mark}</span><span class="to"></span>`;
      btn.querySelector(".to").textContent = show(who);
      box.appendChild(btn);   // kolejność jak w HOUSES (dodane od razu, zanim przyjdzie plik)
      const blocks = await fetchLetter(who);
      if (blocks) {
        found++;
        btn.setAttribute("aria-label", "Otwórz list do Aniołka: " + show(who));
        btn.setAttribute("aria-haspopup", "dialog");
        btn.addEventListener("click", () => openLetter(kind, who, blocks));
      } else {
        btn.classList.add("empty");
        btn.disabled = true;
        btn.querySelector(".seal").textContent = "…";
        btn.querySelector(".to").insertAdjacentHTML("beforeend", "<small>list jeszcze w drodze</small>");
        btn.setAttribute("aria-label", show(who) + ": list jeszcze w drodze");
      }
    });
  }));
  if (!found) {
    const note = content.querySelector(".envs-note");
    note.textContent = "W tym roku nie ma jeszcze żadnych listów.";
    note.hidden = false;
  }
  const back = new URLSearchParams(params);
  back.delete("widok");
  content.insertAdjacentHTML("beforeend", '<a class="back" href="?' + back.toString() + '">← Wróć do losowania</a>');
}
// Pod kartą losowania (dom z listami): wejście na stronę ze wszystkimi listami.
if (lettersView) showAllLetters();
else if (house.children) {
  const to = new URLSearchParams(params);
  to.set("widok", "listy");
  document.getElementById("app").insertAdjacentHTML("beforeend",
    '<p class="more"><a class="to-letters" href="?' + to.toString() + '"><span class="mini-env" aria-hidden="true"></span>' +
    '<span class="t">Listy do Aniołka<small>zobacz listy wszystkich</small></span></a></p>');
}

  if (lettersView) {
    // treść rysuje showAllLetters()
  } else if (!person) {
    content.innerHTML = '<p class="label">Wybierz siebie:</p><ul></ul>';
    const list = content.querySelector("ul");
    for (const p of house.people) {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.className = "person";
      a.href = "?dom=" + houseId + "&osoba=" + encodeURIComponent(p) + (year !== defaultYear ? "&rok=" + year : "");
      a.textContent = show(p);
      li.appendChild(a);
      list.appendChild(li);
    }
  } else {
    content.innerHTML =
      '<p class="label">Cześć <strong></strong>!</p>' +
      '<p class="hint">Kliknij prezent, żeby go otworzyć</p>' +
      '<button type="button" class="present" aria-label="Otwórz prezent">' +
      '<span class="lid"><span class="bow"></span></span><span class="box"></span></button>' +
      '<p class="error" hidden></p><div class="sparkles"></div>' +
      '<div class="result"><p class="label">Twój los na rok <span class="y"></span> — prezent dla:</p>' +
      '<p class="name"></p><div class="child" hidden><p class="label">oraz dla dziecka:</p>' +
      '<p class="name"></p></div><div class="gift">🎁</div></div>';
    content.querySelector("strong").textContent = show(person);
    content.querySelector(".y").textContent = year;
    const button = content.querySelector(".present");
    const hint = content.querySelector(".hint");
    const error = content.querySelector(".error");
    const result = content.querySelector(".result");
    // Po pierwszym otwarciu zapamiętujemy to w przeglądarce i kolejnym razem pokazujemy wynik od razu.
    const storageKey = "otwarte:" + houseId + "/" + year + "/" + person;
    const storage = {
      get() { try { return localStorage.getItem(storageKey) === "1"; } catch (e) { return false; } },
      set() { try { localStorage.setItem(storageKey, "1"); } catch (e) {} },
    };
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;

    async function loadResult() {
      const res = await fetch(houseId + "/" + year + "/" + person + ".txt", { cache: "no-store" });
      if (!res.ok) throw new Error(res.status);
      const [taker, child] = (await res.text()).trim().split(/\s*\n\s*/);
      result.querySelector(".name").textContent = show(taker);
      if (child) {
        const box = result.querySelector(".child");
        box.querySelector(".name").textContent = show(child);
        box.hidden = false;
      }
      return { taker, child };
    }

    function sparkle() {
      const host = content.querySelector(".sparkles");
      for (let i = 0; i < 14; i++) {
        const s = document.createElement("span");
        const angle = (i / 14) * 2 * Math.PI;
        s.textContent = i % 2 ? "✨" : "⭐";
        s.style.setProperty("--x", Math.round(Math.cos(angle) * 130) - 11 + "px");
        s.style.setProperty("--y", Math.round(Math.sin(angle) * 90) + "px");
        host.appendChild(s);
      }
      setTimeout(() => host.remove(), 1100);
    }

    async function open(animate) {
      button.disabled = true;
      error.hidden = true;
      let drawn;
      try {
        drawn = await loadResult();
      } catch (e) {
        button.disabled = false;
        error.textContent = "Nie udało się wczytać wyniku (" + e.message + ").";
        error.hidden = false;
        return;
      }
      storage.set();
      hint.style.visibility = "hidden";
      if (animate && !calm) {
        button.classList.add("shaking");
        await wait(900);
        button.classList.replace("shaking", "open");
        sparkle();
        await wait(800);
      }
      button.remove();
      hint.remove();
      if (!animate) result.style.animation = "none";
      result.classList.add("shown");
      addLetterIcons([["pair", drawn.taker, result.querySelector(".name")],
        ...(drawn.child ? [["child", drawn.child, result.querySelector(".child .name")]] : [])]);
    }

    if (storage.get()) open(false);
    else button.addEventListener("click", () => open(true));
  }
</script>
</body>
</html>
